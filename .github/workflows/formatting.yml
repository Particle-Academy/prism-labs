name: Formatting

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  phpv: 8.4

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.phpv }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Run Pint
        run: |
          vendor/bin/pint
          git diff --exit-code
