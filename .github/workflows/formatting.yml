name: Formatting

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  phpv: 8.4

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: prism-labs
    steps:
      - uses: actions/checkout@v4
        with:
          path: prism-labs
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout every Composer path dependency
        run: node scripts/dogfood-dependencies.mjs --checkout

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.phpv }}
          coverage: none
      # BEFORE the install. `ramsey/composer-install` resolves and installs the
      # whole dependency tree, which is an install performed by an ACTION — a thing
      # neither this estate's audit nor the org's could see, because both asked
      # whether a `run:` string contained an install command. 27 jobs passed both
      # audits green on that question.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          # Checkout paths start at the workspace root; run steps below start
          # inside prism-labs. Keep the checker where those steps look for it.
          # A root-level checkout made node fail with MODULE_NOT_FOUND before
          # the allowlist could check dependencies or Composer could install them.
          path: prism-labs/.third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - uses: ramsey/composer-install@v3
        with:
          working-directory: prism-labs
      - name: Run Pint
        run: |
          vendor/bin/pint
          git diff --exit-code
