name: Harness ports

# The Lab exercises the TypeScript and Python harness ports the way a consumer
# installs them: each candidate is checked out at exactly its pinned commit
# (dogfood-candidate-pins.json, draft candidate PRs, pull_request runs only) or
# at main, built, packed into a tarball or a wheel, and that FILE is installed
# into a throwaway consumer project. The Lab's own scenarios (tests/harness-ports/) then drive
# the public API with a fake model client and the network blocked.
#
# No secrets, no tokens, no provider calls. Every action is pinned to a full
# commit SHA. `harness-ports` is the single check that summarises both lanes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-ports-${{ github.ref }}
  # A newer push to a pull request replaces its run; every run on main completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pins:
    # Which commit each port lane checks out: a candidate pin's exact commit, or main. A job of its own, because a lane
    # may run nothing before it fetches the org dependency policy, so its port checkout is a plain actions/checkout.
    name: Harness port refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ts_ref: ${{ steps.ts.outputs.ref }}
      py_ref: ${{ steps.py.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: ts
        run: node scripts/dogfood-dependencies.mjs --port-ref prism-harness-ts >> "$GITHUB_OUTPUT"
      - id: py
        run: node scripts/dogfood-dependencies.mjs --port-ref prism-harness-py >> "$GITHUB_OUTPUT"

  ts-harness:
    name: Harness port (TypeScript)
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prism-labs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: prism-labs
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Only a pull_request run builds a candidate pin (scripts/dogfood-dependencies.mjs portPins). A push or a
      # dispatch builds the port's main, named literally here, never a ref another job computed.
      - name: Check out the prism-harness-ts candidate (main, or its candidate pin)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Particle-Academy/prism-harness-ts
          ref: ${{ needs.pins.outputs.ts_ref }}
          path: prism-harness-ts
          persist-credentials: false
      - name: Check out prism-harness-ts main
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Particle-Academy/prism-harness-ts
          ref: main
          path: prism-harness-ts
          persist-credentials: false
      - name: Fetch the third-party allowlist
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Particle-Academy/.github
          ref: d368b8173bc81562e0af4035b1cf6fcb207817f9
          path: prism-labs/.third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: prism-labs/.third-party-allowlist
          PIN_DIR: prism-labs/.third-party-allowlist/third-party
          PIN_SHA: d368b8173bc81562e0af4035b1cf6fcb207817f9
          PIN_SHA256: |
            1b97061617b07bffbccbe6aa76ecc7f8b16e74458a113c5032380aa966798498  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b89b1ac2b19857cac2319a83410958067dfda7621bf5821af440732b87982e8a  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '
      - name: Check the allowlist before building or installing anything (this repository and the candidate)
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node .third-party-allowlist/third-party/check.mjs --repo ../prism-harness-ts
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"
      - name: Verify the candidate is exactly the pinned commit (or main's tip)
        run: node scripts/dogfood-dependencies.mjs --verify-port prism-harness-ts
      - name: Record the candidate commit
        id: candidate
        run: |
          sha="$(git -C ../prism-harness-ts rev-parse HEAD)"
          echo "Exercising Particle-Academy/prism-harness-ts at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Build and pack the candidate from its own lock
        run: node scripts/dogfood-dependencies.mjs --pack-port prism-harness-ts
      - name: Install the packed tarball into a throwaway consumer project
        run: node scripts/dogfood-dependencies.mjs --install-port prism-harness-ts
      - name: Run the consumer scenario (public API, fake model, network blocked)
        working-directory: ${{ runner.temp }}/consumer
        env:
          HARNESS_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          status=0
          node scenario.mjs > scenario.log 2>&1 || status=$?
          cat scenario.log
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harness-port-ts
          path: ${{ runner.temp }}/consumer/scenario.log
          if-no-files-found: ignore

  py-harness:
    name: Harness port (Python)
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prism-labs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: prism-labs
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Only a pull_request run builds a candidate pin (scripts/dogfood-dependencies.mjs portPins). A push or a
      # dispatch builds the port's main, named literally here, never a ref another job computed.
      - name: Check out the prism-harness-py candidate (main, or its candidate pin)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Particle-Academy/prism-harness-py
          ref: ${{ needs.pins.outputs.py_ref }}
          path: prism-harness-py
          persist-credentials: false
      - name: Check out prism-harness-py main
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Particle-Academy/prism-harness-py
          ref: main
          path: prism-harness-py
          persist-credentials: false
      - name: Fetch the third-party allowlist
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Particle-Academy/.github
          ref: d368b8173bc81562e0af4035b1cf6fcb207817f9
          path: prism-labs/.third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: prism-labs/.third-party-allowlist
          PIN_DIR: prism-labs/.third-party-allowlist/third-party
          PIN_SHA: d368b8173bc81562e0af4035b1cf6fcb207817f9
          PIN_SHA256: |
            1b97061617b07bffbccbe6aa76ecc7f8b16e74458a113c5032380aa966798498  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b89b1ac2b19857cac2319a83410958067dfda7621bf5821af440732b87982e8a  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '
      - name: Check the allowlist before building or installing anything (this repository and the candidate)
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node .third-party-allowlist/third-party/check.mjs --repo ../prism-harness-py
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"
      - name: Verify the candidate is exactly the pinned commit (or main's tip)
        run: node scripts/dogfood-dependencies.mjs --verify-port prism-harness-py
      - name: Record the candidate commit
        id: candidate
        run: |
          sha="$(git -C ../prism-harness-py rev-parse HEAD)"
          echo "Exercising Particle-Academy/prism-harness-py at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the candidate wheel
        run: node scripts/dogfood-dependencies.mjs --pack-port prism-harness-py
      - name: Install the wheel file into a throwaway virtual environment
        run: node scripts/dogfood-dependencies.mjs --install-port prism-harness-py
      - name: Run the consumer scenario (public API, fake model, network blocked)
        working-directory: ${{ runner.temp }}/consumer
        env:
          HARNESS_SHA: ${{ steps.candidate.outputs.sha }}
          PYTHONIOENCODING: utf-8
        run: |
          status=0
          venv/bin/python -I scenario.py > scenario.log 2>&1 || status=$?
          cat scenario.log
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harness-port-py
          path: ${{ runner.temp }}/consumer/scenario.log
          if-no-files-found: ignore

  harness-ports:
    # One stable check name for both lanes: it fails unless both succeeded.
    name: Harness ports
    needs: [pins, ts-harness, py-harness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both harness port lanes
        env:
          PINS: ${{ needs.pins.result }}
          TS: ${{ needs.ts-harness.result }}
          PY: ${{ needs.py-harness.result }}
        run: |
          echo "Refs: $PINS; TypeScript: $TS; Python: $PY"
          if [ "$PINS" != "success" ] || [ "$TS" != "success" ] || [ "$PY" != "success" ]; then echo "::error::A harness port lane did not pass."; exit 1; fi
