          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Resolve hash-pinned locks on this platform (dry run; nothing is installed)
        run: |
          mkdir -p locks
          python -m pip install --dry-run --ignore-installed --quiet --only-binary=:all: --report harbor-report.json harbor==0.27.0
          python bench/probes/lock.py harbor-report.json locks/harbor.txt
          python - <<'PY'
          import tomllib
          deps = tomllib.load(open("tau2-src/pyproject.toml", "rb"))["project"]["dependencies"]
          open("tau2-deps.txt", "w").write("\n".join(deps + ["hatchling", "editables"]) + "\n")
          PY
          python -m pip install --dry-run --ignore-installed --quiet --only-binary=:all: --report tau2-report.json -r tau2-deps.txt
          python bench/probes/lock.py tau2-report.json locks/tau2.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
