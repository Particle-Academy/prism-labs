          PIN_SHA256: |
            1b97061617b07bffbccbe6aa76ecc7f8b16e74458a113c5032380aa966798498  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
