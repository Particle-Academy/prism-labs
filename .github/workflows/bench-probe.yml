name: Bench probes (free)

# G-393 step 4. NO model calls and NO secrets: this workflow measures whether
# Terminal-Bench 4.1 CPU tasks fit a GitHub-hosted runner (Harbor's nop agent
# builds each task and runs its verifier), whether SWE-bench Lite grading fits
# hosted-runner disk, and resolves the hash-pinned dependency locks the paid
# workflow installs from. Dispatch only.

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Space-separated task names (default: all 63 in bench/probes/terminal-bench-cpu-4.1.0.json)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bench-probe
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tasks: ${{ steps.list.outputs.tasks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        env:
          TASKS: ${{ inputs.tasks }}
        run: |
          python3 - <<'PY'
          import json, os, re
          known = [t["task"] for t in json.load(open("bench/probes/terminal-bench-cpu-4.1.0.json"))["tasks"]]
          asked = os.environ.get("TASKS", "").split()
          for name in asked:
              if name not in known:
                  raise SystemExit(f"::error::unknown task {name!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("tasks=" + json.dumps(asked or known) + "\n")
          PY

  tb-fit:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        task: ${{ fromJson(needs.list.outputs.tasks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Fetch the third-party allowlist
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Particle-Academy/.github
          ref: d368b8173bc81562e0af4035b1cf6fcb207817f9
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: d368b8173bc81562e0af4035b1cf6fcb207817f9
          PIN_SHA256: |
            1b97061617b07bffbccbe6aa76ecc7f8b16e74458a113c5032380aa966798498  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b89b1ac2b19857cac2319a83410958067dfda7621bf5821af440732b87982e8a  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '
      - name: Check the allowlist before installing anything
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Free runner disk (preinstalled toolchains the benchmark does not use)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h /
      - name: Install Harbor (no secrets in this job)
        run: python -m pip install --only-binary=:all: harbor==0.27.0
      - name: Probe one task with the nop agent
        env:
          TASK: ${{ matrix.task }}
        run: python bench/probes/fit_probe.py --task "$TASK" --dataset terminal-bench/terminal-bench-cpu@4.1.0 --out probe-out
      - name: Scrub
        if: always()
        run: python bench/prism_bench/scrub.py probe-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-tb-${{ matrix.task }}
          path: |
            probe-out/probe.json
            probe-out/harbor.log
          retention-days: 30

