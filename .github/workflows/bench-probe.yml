      - name: Smoke all four arms against the fake endpoint
        run: |
          python bench/probes/fake_llm.py 18393 &
          python bench/probes/smoke_plan.py music-harmony smoke-plan.json
          DRIVER=$(python -c "import json,os; w=os.environ['GITHUB_WORKSPACE']; print(json.dumps(['php', w+'/harness-driver/bin/prism-harness-bench', '--autoload='+w+'/bench/harness-release/vendor/autoload.php']))")
          export PATH="$PWD/.venv-tb/bin:$PATH"
          for arm in prism terminus-2; do .venv-tb/bin/python -m prism_bench.cli run-tb --plan smoke-plan.json --arm "$arm" --shard 0 --shards 1 --out "smoke/tb-$arm" --driver "$DRIVER" || true; done
          for arm in prism llm_agent; do .venv-tau2/bin/python -m prism_bench.cli run-tau2 --plan smoke-plan.json --arm "$arm" --out "smoke/tau2-$arm" --tau2-root tau2-src --driver "$DRIVER" || true; done
          python bench/probes/smoke_check.py smoke
      - name: Scrub
        if: always()
        run: python bench/prism_bench/scrub.py smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-smoke
          path: smoke/
          retention-days: 30

  summary:
    needs: [tb-fit, locks, swe-disk, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: probe-*
          path: probes
      - name: Summarise
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          rows = [json.load(open(p)) for p in sorted(glob.glob("probes/probe-tb-*/probe.json"))]
          fits = [r["task"] for r in rows if r["fits"]]
          print(f"### Terminal-Bench CPU fit: {len(fits)} of {len(rows)} probed tasks fit ubuntu-latest\n")
          print("| task | fits | exception | verifier ran | peak disk GB | peak mem GB | seconds |")
          print("|---|---|---|---|---|---|---|")
          for r in rows:
              print(f"| {r['task']} | {r['fits']} | {r['exception_type'] or ''} | {r['verifier_ran']} | {r['disk_peak_gb']} / {r['disk_total_gb']} | {r['mem_peak_gb']} / {r['mem_total_gb']} | {r['seconds']} |")
          try:
              swe = json.load(open("probes/probe-swe/swe-probe.json"))
              print(f"\n### SWE-bench Lite grading disk\n\nfits: {swe['fits']}, max disk delta {swe['max_disk_delta_gb']} GB\n")
          except OSError:
              print("\n### SWE-bench Lite: no result\n")
          PY
