name: ACP dogfood

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * *'

permissions:
  contents: read

jobs:
  acp:
    name: ACP (${{ matrix.resolution }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        resolution: [source, published]
    defaults:
      run:
        working-directory: prism-labs
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DOGFOOD_RESOLUTION: acp-${{ matrix.resolution }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: prism-labs
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch org dependency policy
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: prism-labs/.third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: prism-labs/.third-party-allowlist
          PIN_DIR: prism-labs/.third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '
      - name: Check org dependency policy before installation
        run: node .third-party-allowlist/third-party/check.mjs --repo .
      - name: Checkout every path dependency from its main branch
        run: node scripts/dogfood-dependencies.mjs --checkout
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite3, pdo_sqlite
          coverage: none
      - name: Select the published Packagist release
        if: matrix.resolution == 'published'
        run: php scripts/use-acp-release.php
      - name: Select current sibling source
        if: matrix.resolution == 'source'
        run: php scripts/use-acp-release.php --source
      - name: Resolve the current source ACP consumer
        if: matrix.resolution == 'source'
        run: composer update particle-academy/prism-acp --with-dependencies --no-interaction --prefer-dist --no-progress
      - name: Install the tagged ACP release
        if: matrix.resolution == 'published'
        run: composer update particle-academy/prism-acp --with-dependencies --no-interaction --prefer-dist --no-progress
      - run: composer audit --no-interaction
      - name: Verify release source and dist installation
        if: matrix.resolution == 'published'
        run: php scripts/verify-acp-release.php
      - name: Exercise the real job, host, permission hook, resume and verified cleanup with a fake provider
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan config:clear
          php artisan test --filter=AcpTurnTest --fail-on-warning
      - name: Record code and dependency evidence
        if: always()
        run: node scripts/dogfood-dependencies.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogfood-acp-${{ matrix.resolution }}
          path: |
            prism-labs/dogfood-evidence.json
            prism-labs/dogfood-acp-release.json
            prism-labs/composer.lock
          if-no-files-found: error
