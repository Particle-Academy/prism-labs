name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "25 8 * * *"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        resolution: [locked, current]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        id: pin-checks-node
        with:
          node-version: 22
          cache: npm

      # BEFORE the install, not beside it. `npm ci` runs lifecycle scripts, so
      # an unapproved or unmaintained dependency executes code on this runner
      # the moment it is fetched — checking afterwards would be reporting on
      # something that already happened. The list is fetched, never vendored,
      # so there is no copy here to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          BASH_ENV: ""
          ENV: ""
          PIN_NODE_CACHE: ${{ runner.tool_cache }}
          PIN_NODE_VERSION: ${{ steps.pin-checks-node.outputs.node-version }}
          PIN_NODE_ARCH: ${{ runner.arch }}
          PIN_RUNNER_OS: ${{ runner.os }}
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          version="${PIN_NODE_VERSION#v}"
          arch="${PIN_NODE_ARCH,,}"
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] || { echo "Invalid setup-node version"; exit 1; }
          [[ "$arch" =~ ^(x64|arm64|x86|armv7l)$ ]] || { echo "Invalid setup-node architecture"; exit 1; }
          cache="${PIN_NODE_CACHE//\\//}"
          [[ "$cache" == /* || "$cache" =~ ^[A-Za-z]:/ ]] || { echo "Tool cache is not absolute"; exit 1; }
          case "$PIN_RUNNER_OS" in
            Windows) node_bin="$cache/node/$version/$arch/node.exe" ;;
            Linux|macOS) node_bin="$cache/node/$version/$arch/bin/node" ;;
            *) echo "Unsupported verifier platform"; exit 1 ;;
          esac
          [[ -x "$node_bin" ]] || { echo "setup-node executable missing"; exit 1; }
          "$node_bin" -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - name: Install dependencies
        run: npm ci

      - name: Resolve current compatible dependencies
        if: matrix.resolution == 'current'
        run: npm update --ignore-scripts

      - name: Dependency guard assertions
        run: node --test scripts/dogfood-dependencies.test.mjs

      # vite strips types rather than checking them, so a build passing says
      # nothing about whether the types hold. The Lab is the largest React
      # surface here and the one most likely to drift; this is the step that
      # would notice.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Provider probe UI assertions
        run: npm run test:ui

      - name: Install the browser used by the dogfood UI tests
        run: npx playwright install --with-deps chromium

      - name: Consensus and Benchmarks browser regressions
        run: npm run test:dogfood-ui

      - name: Install the committed isolated renderer without lifecycle scripts
        run: npm ci --prefix tools/remotion-runtime --ignore-scripts

      - name: Render and independently inspect the deterministic Remotion control
        run: npm run test:remotion-runtime

      # Client and SSR both, because the SSR bundle is built separately and
      # can fail on its own — an import that resolves in the browser build
      # and not on the server would ship unnoticed otherwise.
      - name: Build
        run: npm run build

      - name: Audit the resolved dependency graph
        if: always()
        run: npm audit --audit-level=high

      - name: Check first-party packages against the uncached registry
        if: always() && matrix.resolution == 'current'
        run: node scripts/dogfood-dependencies.mjs --currency

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogfood-frontend-${{ matrix.resolution }}
          path: |
            package-lock.json
            tools/remotion-runtime/package-lock.json
            remotion-render-evidence.json
          if-no-files-found: error
