name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        resolution: [locked, current]
    defaults:
      run:
        working-directory: prism-labs
    env:
      DOGFOOD_RESOLUTION: ${{ matrix.resolution }}
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # No provider secrets, deployment, or live generations in CI.
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

    steps:
      - uses: actions/checkout@v4
        with:
          path: prism-labs
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: pin-checks-node
        with:
          node-version: "22"
      - name: Validate dependency checkout and currency guards
        run: node --test scripts/dogfood-dependencies.test.mjs
      - name: Checkout every path dependency from its main branch
        run: node scripts/dogfood-dependencies.mjs --checkout
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite3, pdo_sqlite
          coverage: none
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: prism-labs/.third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          BASH_ENV: ""
          ENV: ""
          PIN_NODE_CACHE: ${{ runner.tool_cache }}
          PIN_NODE_VERSION: ${{ steps.pin-checks-node.outputs.node-version }}
          PIN_NODE_ARCH: ${{ runner.arch }}
          PIN_RUNNER_OS: ${{ runner.os }}
          PIN_ROOT: prism-labs/.third-party-allowlist
          PIN_DIR: prism-labs/.third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          version="${PIN_NODE_VERSION#v}"
          arch="${PIN_NODE_ARCH,,}"
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] || { echo "Invalid setup-node version"; exit 1; }
          [[ "$arch" =~ ^(x64|arm64|x86|armv7l)$ ]] || { echo "Invalid setup-node architecture"; exit 1; }
          cache="${PIN_NODE_CACHE//\\//}"
          [[ "$cache" == /* || "$cache" =~ ^[A-Za-z]:/ ]] || { echo "Tool cache is not absolute"; exit 1; }
          case "$PIN_RUNNER_OS" in
            Windows) node_bin="$cache/node/$version/$arch/node.exe" ;;
            Linux|macOS) node_bin="$cache/node/$version/$arch/bin/node" ;;
            *) echo "Unsupported verifier platform"; exit 1 ;;
          esac
          [[ -x "$node_bin" ]] || { echo "setup-node executable missing"; exit 1; }
          "$node_bin" -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '
      - name: Check the allowlist before installing dependencies
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"
      - name: Check discovery and failure behavior for every committed lockfile
        run: node --test scripts/audit-locks.test.mjs
      - name: Audit every committed npm and Composer lockfile
        run: npm run audit:locks
      - uses: ramsey/composer-install@v3
        with:
          working-directory: prism-labs
      - name: Resolve current compatible dependencies
        if: matrix.resolution == 'current'
        run: composer update --with-all-dependencies --no-interaction --no-progress
      - name: Audit the resolved dependencies
        run: composer audit --no-interaction
      - name: Execute the complete suite
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          composer test -- --fail-on-warning
      - name: Exercise the required dogfood paths explicitly
        run: vendor/bin/phpunit --group dogfood --fail-on-empty-test-suite
      - name: Check first-party released dependencies against Packagist
        if: always() && matrix.resolution == 'current'
        run: node scripts/dogfood-dependencies.mjs --composer-currency
      - name: Record the exact code and dependency graph tested
        if: always()
        run: node scripts/dogfood-dependencies.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogfood-php-${{ matrix.resolution }}
          path: |
            prism-labs/dogfood-evidence.json
            prism-labs/composer.lock
            prism-labs/lock-audit-evidence.json
          if-no-files-found: error
