name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  phpv: 8.4

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.phpv }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      # No stability matrix, unlike the packages in this org. This is an
      # application: it ships the lock file, so the only resolution worth
      # testing is the one it actually deploys. A prefer-lowest run here
      # would prove something no environment will ever run.
      #
      # It does mean CI follows the first-party prereleases this app now
      # tracks — which is the point of tracking them.
      - uses: ramsey/composer-install@v3

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # sqlite in memory, per phpunit.xml — no service container needed.
      - name: Execute tests
        run: vendor/bin/phpunit

  third-party:
    name: Third-party dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # This job only reads files, so it keeps no token in .git/config for
      # the fetched checker to find.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every direct dependency must be approved on the org allowlist and still
      # maintained. The list is fetched, never vendored, so there is no copy here
      # to drift. Nothing is published from this repository, so this workflow is
      # the whole gate.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"
