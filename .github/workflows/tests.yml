name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        resolution: [locked, current]
    defaults:
      run:
        working-directory: prism-labs
    env:
      DOGFOOD_RESOLUTION: ${{ matrix.resolution }}
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # No provider secrets, deployment, or live generations in CI.
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

    steps:
      - uses: actions/checkout@v4
        with:
          path: prism-labs
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate dependency checkout and currency guards
        run: node --test scripts/dogfood-dependencies.test.mjs
      - name: Checkout every path dependency from its main branch
        run: node scripts/dogfood-dependencies.mjs --checkout
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite3, pdo_sqlite
          coverage: none
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: prism-labs/.third-party-allowlist
          persist-credentials: false
      - name: Check the allowlist before installing dependencies
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"
      - name: Check discovery and failure behavior for every committed lockfile
        run: node --test scripts/audit-locks.test.mjs
      - name: Audit every committed npm and Composer lockfile
        run: npm run audit:locks
      - uses: ramsey/composer-install@v3
        with:
          working-directory: prism-labs
      - name: Resolve current compatible dependencies
        if: matrix.resolution == 'current'
        run: composer update --with-all-dependencies --no-interaction --no-progress
      - name: Audit the resolved dependencies
        run: composer audit --no-interaction
      - name: Execute the complete suite
        run: composer test
      - name: Exercise the required dogfood paths explicitly
        run: vendor/bin/phpunit --group dogfood --fail-on-empty-test-suite
      - name: Check first-party released dependencies against Packagist
        if: always() && matrix.resolution == 'current'
        run: node scripts/dogfood-dependencies.mjs --composer-currency
      - name: Record the exact code and dependency graph tested
        if: always()
        run: node scripts/dogfood-dependencies.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogfood-php-${{ matrix.resolution }}
          path: |
            prism-labs/dogfood-evidence.json
            prism-labs/composer.lock
            prism-labs/lock-audit-evidence.json
          if-no-files-found: error
