name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  phpv: 8.4

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prism-labs

    steps:
      - uses: actions/checkout@v4
        with:
          path: prism-labs

      # The Lab builds against its sibling packages' WORKING TREES, through
      # composer path repositories (`../prism` and seven more), so it can test a
      # change before that change is published. A runner has no siblings, and
      # from 2026-09-10 every run failed at composer install with "Source path
      # ../prism is not found" -- the gate went red and stayed red.
      #
      # So CI lays the workspace out the way the envelope does: the Lab and each
      # sibling side by side, each sibling at its main branch.
      - uses: actions/checkout@v4
        with: { repository: Particle-Academy/prism, path: prism, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: Particle-Academy/prism-harness, path: prism-harness, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: Particle-Academy/prism-browser, path: prism-browser, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: Particle-Academy/prism-human-plus, path: prism-human-plus, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: Particle-Academy/prism-workspace, path: prism-workspace, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: Particle-Academy/prism-mcp, path: prism-mcp, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: Particle-Academy/prism-opentelemetry, path: prism-opentelemetry, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: Particle-Academy/prism-perplexity, path: prism-perplexity, persist-credentials: false }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.phpv }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      # No stability matrix, unlike the packages in this org. This is an
      # application: it ships the lock file, so the only resolution worth
      # testing is the one it actually deploys. A prefer-lowest run here
      # would prove something no environment will ever run.
      #
      # It does mean CI follows the first-party prereleases this app now
      # tracks — which is the point of tracking them.
      - uses: ramsey/composer-install@v3
        with:
          working-directory: prism-labs

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # sqlite in memory, per phpunit.xml — no service container needed.
      - name: Execute tests
        run: vendor/bin/phpunit

  third-party:
    name: Third-party dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # This job only reads files, so it keeps no token in .git/config for
      # the fetched checker to find.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every direct dependency must be approved on the org allowlist and still
      # maintained. The list is fetched, never vendored, so there is no copy here
      # to drift. Nothing is published from this repository, so this workflow is
      # the whole gate.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"
